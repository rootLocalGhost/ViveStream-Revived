name: Windows Builds
on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean NPM cache'
        required: false
        type: boolean
        default: false
jobs:
  build-win:
    name: Build Windows ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: 'nsis'
            ext: 'exe'
          - target: 'msi'
            ext: 'msi'
          - target: 'source'
            ext: 'zip'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '25'
          cache: 'npm'
      - name: Clean NPM Cache (Optional)
        if: ${{ inputs.clean_cache }}
        run: npm cache clean --force
      - name: Install NPM Dependencies
        run: npm ci --silent
      - name: Initialize Vendor Binaries
        run: npm run vendor:init
      - name: Verify Windows Assets
        shell: powershell
        run: |
          if (-not (Test-Path "build/installer.nsh")) {
            Write-Error "build/installer.nsh NOT FOUND. Build will fail."
            exit 1
          }
      - name: Build Application
        shell: bash
        run: |
          node helpers/builder.js --win --target=${{ matrix.target }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-${{ matrix.target }}
          path: 'release/*.${{ matrix.ext }}'
          retention-days: 5
