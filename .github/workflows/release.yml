name: Build and Release

on:
  workflow_dispatch:
    inputs:
      clean_cache:
        description: 'Clean NPM cache'
        required: false
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  discussions: write

jobs:
  build_linux:
    name: Build Linux
    runs-on: ubuntu-24.04
    outputs:
      artifact_path: ${{ steps.get_artifact_path.outputs.path }}
      version: ${{ steps.version_check.outputs.val }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Checkout Portable Python
        uses: actions/checkout@v4
        with:
          repository: Md-Siam-Mia-Main/python-portable
          path: python-portable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Reassemble Large Files
        run: npm run files:join
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools flatpak flatpak-builder fakeroot dpkg-dev libsecret-1-dev libfuse2 libgl1-mesa-dev build-essential graphicsmagick
          sudo snap install snapcraft --classic
      - name: Clean NPM Cache (Optional)
        if: ${{ inputs.clean_cache }}
        run: npm cache clean --force
      - name: Configure NPM Retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
      - name: Install NPM Dependencies
        run: npm ci
      - name: Hydrate Python Environment
        run: npm run env:update
      - name: Verify Version
        shell: bash
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "val=$PKG_VERSION" >> $GITHUB_OUTPUT
      - name: Build Application
        shell: bash
        run: npm run build:linux:ci
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Artifact Path
        id: get_artifact_path
        run: echo "path=release/linux" >> $GITHUB_OUTPUT
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Linux-Builds
          path: ${{ steps.get_artifact_path.outputs.path }}
          retention-days: 5

  build_windows:
    name: Build Windows
    runs-on: windows-latest
    outputs:
      artifact_path: ${{ steps.get_artifact_path.outputs.path }}
      version: ${{ steps.version_check.outputs.val }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
      - name: Checkout Portable Python
        uses: actions/checkout@v4
        with:
          repository: Md-Siam-Mia-Main/python-portable
          path: python-portable
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Reassemble Large Files
        run: npm run files:join
      - name: Clean NPM Cache (Optional)
        if: ${{ inputs.clean_cache }}
        run: npm cache clean --force
      - name: Configure NPM Retries
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
      - name: Install NPM Dependencies
        run: npm ci
      - name: Hydrate Python Environment
        run: npm run env:update
      - name: Verify Windows Assets
        shell: powershell
        run: |
          if (-not (Test-Path "build/installer.nsh")) {
            Write-Error "build/installer.nsh NOT FOUND. Build will fail."
            exit 1
          }
      - name: Verify Version
        shell: bash
        id: version_check
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "val=$PKG_VERSION" >> $GITHUB_OUTPUT
      - name: Build Application
        shell: bash
        run: node helpers/builder.js --win --target=nsis,msi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Get Artifact Path
        id: get_artifact_path
        run: echo "path=release/win" >> $GITHUB_OUTPUT
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Builds
          path: ${{ steps.get_artifact_path.outputs.path }}
          retention-days: 5

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build_linux, build_windows]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download Linux Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Linux-Builds
          path: ${{ needs.build_linux.outputs.artifact_path }}
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: Windows-Builds
          path: ${{ needs.build_windows.outputs.artifact_path }}
      - name: Create Source Archive
        shell: bash
        run: |
          zip -r release/ViveStream-Source-v${{ needs.build_linux.outputs.version }}.zip . \
            -x "node_modules/*" "python-portable/*" ".git/*" "release/*" "*.log" "helpers/large-file-manager.js"
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/linux/*.AppImage
            release/linux/*.deb
            release/linux/*.rpm
            release/linux/*.snap
            release/linux/*.flatpak
            release/linux/*.tar.gz
            release/linux/*.tar.xz
            release/win/*.exe
            release/win/*.msi
            release/ViveStream-Source-*.zip
          draft: true
          prerelease: false
          make_latest: true
          generate_release_notes: true
          name: 'ViveStream Revived v${{ needs.build_linux.outputs.version }} 🚀'
          tag_name: 'v${{ needs.build_linux.outputs.version }}'
          body: |
            ## 🌟 ViveStream Revived - What's New?

            Welcome to the latest version of **ViveStream**! This release brings performance improvements, bug fixes, and better stability.

            ### 🛠️ Installation
            - **Windows**: Download the `.exe` or `.msi` installer.
            - **Linux**: Use the `AppImage`, `.deb`, `.rpm`, `.snap`, `.flatpak` or tarballs.

            ---
            ### ⚠️ Security Note (Code Signing)
            > **Notice**: This application is not code-signed because the developer does not currently have a commercial signing certificate. 
            > 
            > - **Windows**: You may see a "Microsoft Defender SmartScreen" warning. Click **"More info"** and then **"Run anyway"**.

            Rest assured, the application is safe to use and the source code is provided below for transparency.

            ---
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
